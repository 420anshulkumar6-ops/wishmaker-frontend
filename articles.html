<script src="js/articles-data.js"></script>
<script>
  // POSTS_PER_PAGE controls how many show per page (10 → 3 pages total).
  const POSTS_PER_PAGE = 10;
  const articles = window.ARTICLES;

  const totalPages = Math.ceil(articles.length / POSTS_PER_PAGE);
  const deck = document.getElementById("blogDeck");
  const pagination = document.getElementById("pagination");

  function renderPage(page) {
    deck.innerHTML = "";
    const start = (page - 1) * POSTS_PER_PAGE;
    const pageItems = articles.slice(start, start + POSTS_PER_PAGE);

    pageItems.forEach(a => {
      const el = document.createElement("a");
      el.href = `article.html?id=${a.id}`;
      el.className = "blog-card";
      el.innerHTML = `
        <span class="blog-emoji">${a.emoji}</span>
        <span>
          <span class="blog-title">${a.title}</span>
          <span class="blog-desc">${a.desc}</span>
          <span class="blog-meta">${a.time}</span>
        </span>
      `;
      deck.appendChild(el);
    });

    renderPagination(page);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderPagination(page) {
    pagination.innerHTML = "";

    const prevBtn = document.createElement("button");
    prevBtn.textContent = "← Prev";
    prevBtn.disabled = page === 1;
    prevBtn.addEventListener("click", () => renderPage(page - 1));
    pagination.appendChild(prevBtn);

    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement("button");
      btn.textContent = i;
      btn.className = "page-num" + (i === page ? " active" : "");
      btn.addEventListener("click", () => renderPage(i));
      pagination.appendChild(btn);
    }

    const nextBtn = document.createElement("button");
    nextBtn.textContent = "Next →";
    nextBtn.disabled = page === totalPages;
    nextBtn.addEventListener("click", () => renderPage(page + 1));
    pagination.appendChild(nextBtn);
  }

  renderPage(1);
</script>

</body>
</html>
