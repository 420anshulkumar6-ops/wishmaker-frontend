<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Occasions — WishMaker</title>
<meta name="description" content="Browse every video wish card — birthday, Raksha Bandhan, Diwali, anniversary and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="index.html" class="logo">WishMaker</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#categoryDeck" class="primary">Create a Video Wish</a>
      <a href="articles.html" class="accent">Blog</a>
    </div>
  </div>
</header>

<main>
  <section class="hero wrap" style="padding-bottom:0;">
    <p class="eyebrow">All Occasions</p>
    <h1>Every Card, <span class="accent">One Place</span></h1>
    <p class="hero-sub">Pick any occasion below to start creating your video wish.</p>
  </section>

  <div class="wrap" style="padding-top:30px;">
    <div class="deck-label"><h2>All Occasions</h2></div>
  </div>
  <section class="deck wrap" aria-label="All occasions" id="categoryDeck"></section>
</main>

<footer class="wrap">
  <nav class="footer-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="contact.html">Contact Us</a>
    <a href="disclaimer.html">Disclaimer</a>
  </nav>
  <p class="footer-copy">© 2026 WishMaker. All rights reserved.</p>
</footer>

<script type="module">
  import { categorySettings } from "./js/category-config.js";

  const categoryGradients = {
    birthday: "linear-gradient(160deg, #4a2540, #241C2C 55%, #3a2416)",
    rakhi: "linear-gradient(160deg, #3a2a12, #241C2C 55%, #3a2a45)",
    diwali: "linear-gradient(160deg, #3a2f10, #241C2C 55%, #2e1c30)",
    anniversary: "linear-gradient(160deg, #3a1c30, #241C2C 55%, #2c2040)",
  };
  const themeEyebrow = {
    birthday: "Celebrate", rakhi: "Festival", diwali: "Lights", anniversary: "Love",
  };
  const defaultGradient = "linear-gradient(160deg, #2e2438, #241C2C 55%, #241C2C)";

  const deck = document.getElementById("categoryDeck");
  Object.entries(categorySettings).forEach(([key, cat]) => {
    const a = document.createElement("a");
    a.href = `category.html?theme=${key}`;
    a.className = "occasion-card";
    a.style.background = categoryGradients[key] || defaultGradient;
    a.innerHTML = `
      <span class="card-emoji">${cat.icon || "✨"}</span>
      <span class="card-overlay"></span>
      <span class="card-content">
        <span class="card-eyebrow">${themeEyebrow[key] || "Wish"}</span>
        <span class="card-name">${cat.label}</span>
        <span class="card-tagline">${cat.tagline || ""}</span>
        <span class="card-cta">Use This Card</span>
      </span>
    `;
    deck.appendChild(a);
  });
</script>

</body>
</html>
